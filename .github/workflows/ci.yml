name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          brew install shellcheck
          shellcheck -x install.sh scripts/*.sh tests/run.sh
      - name: Tests
        run: tests/run.sh
